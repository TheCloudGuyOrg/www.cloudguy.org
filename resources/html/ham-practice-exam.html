<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ham Radio Practice Exams</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;padding:20px}
.container{max-width:800px;margin:0 auto}
h1{text-align:center;color:#00d4ff;margin-bottom:8px;font-size:1.8rem}
.subtitle{text-align:center;color:#888;margin-bottom:30px;font-size:0.9rem}
#setup{background:#16213e;border-radius:12px;padding:40px;text-align:center;border:1px solid #0f3460}
#setup h2{color:#00d4ff;margin-bottom:20px}
#setup p{color:#aaa;margin-bottom:24px;line-height:1.6}
.preset-buttons{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:24px}
.preset-btn{background:#0f3460;border:2px solid #00d4ff;color:#00d4ff;padding:12px 24px;border-radius:8px;font-size:1rem;cursor:pointer;transition:all 0.2s}
.preset-btn:hover{background:#00d4ff;color:#1a1a2e}
.custom-input{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}
.custom-input input{width:80px;padding:10px;border-radius:8px;border:2px solid #0f3460;background:#1a1a2e;color:#e0e0e0;font-size:1rem;text-align:center}
.custom-input button{background:#e94560;border:none;color:white;padding:10px 20px;border-radius:8px;font-size:1rem;cursor:pointer}
.custom-input button:hover{background:#ff6b6b}
#quiz{display:none}
.progress-bar{background:#0f3460;border-radius:20px;height:8px;margin-bottom:20px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#00d4ff,#e94560);height:100%;border-radius:20px;transition:width 0.3s}
.question-info{display:flex;justify-content:space-between;margin-bottom:12px;font-size:0.85rem;color:#888}
.question-card{background:#16213e;border-radius:12px;padding:30px;border:1px solid #0f3460;margin-bottom:20px}
.question-id{color:#00d4ff;font-size:0.8rem;font-weight:600;margin-bottom:12px}
.question-text{font-size:1.15rem;line-height:1.5;margin-bottom:24px;color:#fff}
.question-figure{margin-bottom:20px;text-align:center}
.question-figure img{max-width:100%;border-radius:8px;background:#fff;padding:10px}
.answers{display:flex;flex-direction:column;gap:10px}
.answer-btn{background:#1a1a2e;border:2px solid #0f3460;color:#e0e0e0;padding:14px 18px;border-radius:8px;text-align:left;font-size:1rem;cursor:pointer;transition:all 0.2s;line-height:1.4}
.answer-btn:hover:not(.disabled){border-color:#00d4ff;background:#0f3460}
.answer-btn.correct{border-color:#4caf50;background:rgba(76,175,80,0.15);color:#4caf50}
.answer-btn.incorrect{border-color:#e94560;background:rgba(233,69,96,0.15);color:#e94560}
.answer-btn.disabled{cursor:default}
.answer-letter{display:inline-block;width:28px;height:28px;line-height:28px;text-align:center;border-radius:50%;background:#0f3460;color:#00d4ff;font-weight:600;margin-right:12px;font-size:0.85rem}
.feedback{margin-top:16px;padding:14px;border-radius:8px;display:none;font-size:0.95rem}
.feedback.correct-fb{display:block;background:rgba(76,175,80,0.1);border:1px solid #4caf50;color:#4caf50}
.feedback.incorrect-fb{display:block;background:rgba(233,69,96,0.1);border:1px solid #e94560;color:#e94560}
.ref-text{color:#888;font-size:0.8rem;margin-top:8px}
.next-btn{display:none;margin-top:20px;background:#00d4ff;border:none;color:#1a1a2e;padding:14px 32px;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;width:100%}
.next-btn:hover{background:#33dfff}
#results{display:none}
.results-card{background:#16213e;border-radius:12px;padding:40px;text-align:center;border:1px solid #0f3460}
.score-circle{width:160px;height:160px;border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;font-weight:700}
.score-circle.pass{border:6px solid #4caf50;color:#4caf50}
.score-circle.fail{border:6px solid #e94560;color:#e94560}
.results-text{font-size:1.2rem;margin-bottom:8px}
.results-detail{color:#888;margin-bottom:30px}
.results-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.results-actions button{padding:12px 24px;border-radius:8px;font-size:1rem;cursor:pointer;border:none}
.btn-primary{background:#00d4ff;color:#1a1a2e;font-weight:600}
.btn-primary:hover{background:#33dfff}
.btn-secondary{background:#0f3460;color:#00d4ff;border:2px solid #00d4ff !important}
.btn-secondary:hover{background:#00d4ff;color:#1a1a2e}
.review-section{margin-top:30px;text-align:left}
.review-section h3{color:#e94560;margin-bottom:16px}
.review-item{background:#1a1a2e;border-radius:8px;padding:16px;margin-bottom:12px;border:1px solid #0f3460}
.review-item .q-id{color:#00d4ff;font-size:0.8rem;font-weight:600}
.review-item .q-text{margin:8px 0;font-size:0.95rem}
.review-item .your-answer{color:#e94560;font-size:0.9rem}
.review-item .correct-answer{color:#4caf50;font-size:0.9rem}
.exam-buttons{display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.exam-btn{background:#0f3460;border:2px solid #00d4ff;color:#00d4ff;padding:16px 24px;border-radius:8px;font-size:1.1rem;cursor:pointer;transition:all 0.2s;text-align:left}
.exam-btn:hover{background:#00d4ff;color:#1a1a2e}
.exam-btn small{display:block;font-size:0.8rem;opacity:0.8;margin-top:4px}
.back-link{background:none;border:none;color:#888;cursor:pointer;font-size:0.9rem;margin-bottom:16px;text-decoration:underline}
.back-link:hover{color:#00d4ff}

</style>
</head>
<body>
<div class="container">
<h1 id="title">Ham Radio Practice Exams</h1>
<p class="subtitle" id="subtitle">Select an exam</p>
<div id="examSelect">
<div style="background:#16213e;border-radius:12px;padding:40px;text-align:center;border:1px solid #0f3460">
<h2 style="color:#00d4ff;margin-bottom:20px">Which exam?</h2>
<div class="exam-buttons" id="examButtons"></div>
</div>
</div>
<div id="setup" style="display:none">
<button class="back-link" onclick="showExamSelect()">&larr; Change exam</button>
<h2>How many questions?</h2>
<p id="setupInfo"></p>
<div class="preset-buttons" id="presetButtons"></div>
<div class="custom-input">
<label for="customCount" style="color:#aaa;">Custom:</label>
<input type="number" id="customCount" min="1" value="25">
<button onclick="startQuiz(parseInt(document.getElementById('customCount').value))">Start</button>
</div>
</div>
<div id="quiz">
<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
<div class="question-info"><span id="questionCounter"></span><span id="scoreTracker"></span></div>
<div class="question-card">
<div class="question-id" id="questionId"></div>
<div class="question-figure" id="questionFigure"></div>
<div class="question-text" id="questionText"></div>
<div class="answers" id="answersContainer"></div>
<div class="feedback" id="feedback"></div>
</div>
<button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question</button>
</div>
<div id="results">
<div class="results-card">
<div class="score-circle" id="scoreCircle"></div>
<div class="results-text" id="resultsText"></div>
<div class="results-detail" id="resultsDetail"></div>
<div class="results-actions">
<button class="btn-primary" onclick="startQuiz(totalQuestions)">Try Again</button>
<button class="btn-secondary" onclick="showSetup()">Change Settings</button>
<button class="btn-secondary" onclick="showExamSelect()">Change Exam</button>
</div>
<div class="review-section" id="reviewSection"></div>
</div>
</div>
</div>

tem","Revocation of the station license or suspension of the operator license","Fine and suspension of operator license"],"figure":"","correct_letter":"C"},{"id":"T1C05","correct":2,"refs":"","question":"Which of the following is a valid Group D call sign format for Technician class?","answers":["KA1X","All these choices are correct","KF1XXX","W1XX"],"figure":"","correct_letter":"C"},{"id":"T1C06","correct":0,"refs":"[97.5(a)(2), 97.11(a)]","question":"Which of the following statements is true about using your amateur radio license when operating aboard a vessel or craft in international waters?","answers":["You may operate from a US-documented vessel with the master's permission","You may only operate during maritime emergencies","Amateur operation is prohibited in international waters","You need special FCC authorization for maritime mobile operation"],"figure":"","correct_letter":"A"},{"id":"T1C07","correct":1,"refs":"[97.21, 1.949]","question":"How long before the expiration date may an amateur radio license renewal be requested?","answers":["30 days","90 days","6 months","1 year"],"figure":"","correct_letter":"B"},{"id":"T1C08","correct":0,"refs":"[97.25]","question":"What is the normal term for an FCC-issued amateur radio license?","answers":["Ten years","Five years","Life","Eight years"],"figure":"","correct_letter":"A"},{"id":"T1C09","correct":0,"refs":"[97.21(a)(b)]","question":"What is the grace period for renewal if an amateur license expires?","answers":["Two years","Ten years","Five years","Three years"],"figure":"","correct_letter":"A"},{"id":"T1C10","correct":2,"refs":"[97.5a]","question":"How soon after passing the examination for your first amateur radio license may you transmit on the amateur radio bands?","answers":["Immediately on receiving your Certificate of Successful Completion of Examination (CSCE)","As soon as your operator/station license grant appears on the ARRL website","As soon as your operator/station license grant appears in the FCC\ ure all capacitors used for high-voltage DC are fully discharged before working inside equipment","Use three-wire cords and plugs for all AC powered equipment","Connect all AC powered station equipment to a common safety ground"],"figure":"","correct_letter":"A"},{"id":"T0A07","correct":1,"refs":"","question":"Where should a lightning arrester be installed in a coaxial feed line?","answers":["At the antenna feed point","On a grounded panel near where feed lines enter the building","At the AC power service panel","At the output connector of a transceiver"],"figure":"","correct_letter":"B"},{"id":"T0A08","correct":2,"refs":"","question":"Where should a fuse or circuit breaker be installed in a 120V AC power circuit?","answers":["In parallel with the hot conductor only","In parallel with the hot and neutral conductors","In series with the hot conductor only","In series with the hot and neutral conductors"],"figure":"","correct_letter":"C"},{"id":"T0A09","correct":2,"refs":"","question":"What should be done to all external ground rods or earth connections?","answers":["Tune them for resonance on the lowest frequency of operation","Waterproof them with silicone caulk or electrical tape","Bond them together with heavy wire or conductive strap","Keep them as far apart as possible"],"figure":"","correct_letter":"C"},{"id":"T0A10","correct":2,"refs":"","question":"What hazard exists when rapidly charging or discharging an unprotected battery?","answers":["Excess output ripple","Overvoltage","Overheating or out-gassing","Electric shock"],"figure":"","correct_letter":"C"},{"id":"T0A11","correct":1,"refs":"","question":"What hazard exists in a power supply immediately after turning it off?","answers":["Leakage flux in the power transformer","Charge stored in filter capacitors","Circulating currents in the dc filter","Voltage transients from kickback diodes"],"figure":"","correct_letter":"B"},{"id":"T0A12","correct":0,"refs":"","question":"Which of the following precautions should be taken when measuring high voltages with a voltmeter?","answers":["Ensure that the voltmeter and its leads are rated for use at the voltages being measured","Ensure that the circuit is grounded through the voltmeter","Ensure that the voltmeter is set to the correct frequency","Ensure that the voltmeter has very low impedance"],"figure":"","correct_letter":"A"},{"id":"T0B01","correct":3,"refs":"","question":"Which of the following is good practice when installing ground wires on a tower for lightning protection?","answers":["All these choices are correct","Make sure all ground wire bends are right angles","Put a drip loop in the ground connection to prevent water damage to the ground system","Ensure that connections are short and direct"],"figure":"","correct_letter":"D"},{"id":"T0B02","correct":2,"refs":"","question":"What is required when climbing an antenna tower?","answers":["Always wear an approved climbing harness","Use appropriate tie-off to the tower at all times","All these choices are correct","Have sufficient training on safe tower climbing techniques"],"figure":"","correct_letter":"C"},{"id":"T0B03","correct":2,"refs":"","question":"Under what circumstances is it safe to climb a tower without a helper or observer?","answers":["When the work being done is not more than 20 feet above the ground","When no mechanical work is being performed","Never","When no electrical work is being performed"],"figure":"","correct_letter":"C"},{"id":"T0B04","correct":2,"refs":"","question":"Which of the following is an important safety precaution to observe when putting up an antenna tower?","answers":["Insulate the base of the tower to avoid lightning strikes","All these choices are correct","Look for and stay clear of any overhead electrical wires","Wear a ground strap connected to your wrist at all times"],"figure":"","correct_letter":"C"},{"id":"T0B05","correct":2,"refs":"","question":"What is the purpose of a safety wire through a turnbuckle used to tension guy lines?","answers":["Secure the guy line if the turnbuckle breaks","Provide a ground path for lightning strikes","Prevent loosening of the turnbuckle from vibration","Provide an ability to measure for proper tensioning"],"figure":"","correct_letter":"C"},{"id":"T0B06","correct":1,"refs":"","question":"What is the minimum safe distance from a power line to allow when installing an antenna?","answers":["1/2 wavelength at the operating frequency","Enough so that if the antenna falls, no part of it can come within 10 feet of the power wires","The height of the power line above ground","Add the height of the antenna to the height of the power line and multiply by a factor of 1.5"],"figure":"","correct_letter":"B"},{"id":"T0B07","correct":2,"refs":"","question":"Which of the following is an important safety rule to remember when using a crank-up tower?","answers":["All these choices are correct","This type of tower must never be grounded","This type of tower must not be climbed unless it is retracted, or mechanical safety locking devices have been installed","This type of tower must never be painted"],"figure":"","correct_letter":"C"},{"id":"T0B08","correct":3,"refs":"","question":"Which is a proper grounding method for a tower?","answers":["A ferrite-core RF choke connected between the tower and ground","A single four-foot ground rod, driven into the ground no more than 12 inches from the base","A connection between the tower base and a cold-water pipe","Separate eight-foot ground rods for each tower leg, bonded to the tower and each other"],"figure":"","correct_letter":"D"},{"id":"T0B09","correct":1,"refs":"","question":"Why should you avoid attaching an antenna to a utility pole?","answers":["All these choices are correct","The antenna could contact high-voltage power lines","The antenna may unbalance the power transformer, causing power fluctuations","The antenna will not work properly because of induced voltages"],"figure":"","correct_letter":"B"},{"id":"T0B10","correct":2,"refs":"","question":"Which of the following is true when installing grounding conductors used for lightning protection?","answers":["Wires must be carefully routed with precise right-angle bends","Use only non-insulated wire","Sharp bends must be avoided","Common grounds must be avoided"],"figure":"","correct_letter":"C"},{"id":"T0B11","correct":1,"refs":"","question":"Which of the following establishes grounding requirements for an amateur radio tower or antenna?","answers":["FCC Part 97 rules","Local electrical codes","FAA tower lighting regulations","UL recommended practices"],"figure":"","correct_letter":"B"},{"id":"T0C01","correct":2,"refs":"","question":"What type of radiation are radio signals?","answers":["Alpha radiation","Ionizing radiation","Non-ionizing radiation","Gamma radiation"],"figure":"","correct_letter":"C"},{"id":"T0C02","correct":3,"refs":"","question":"Which of the following bands has the lowest maximum permissible exposure for RF safety?","answers":["1296 MHz","440 MHz","3.5 MHz","50 MHz"],"figure":"","correct_letter":"D"},{"id":"T0C03","correct":3,"refs":"","question":"How does the allowable power density for RF safety change if duty cycle changes from 100 percent to 50 percent?","answers":["It increases by a factor of 3","It decreases by 50 percent","There is no adjustment allowed for lower duty cycle","It increases by a factor of 2"],"figure":"","correct_letter":"D"},{"id":"T0C04","correct":3,"refs":"","question":"What factors affect the RF exposure of people near an amateur station antenna?","answers":["Frequency and power level of the RF field","Distance from the antenna to a person","Radiation pattern of the antenna","All these choices are correct"],"figure":"","correct_letter":"D"},{"id":"T0C05","correct":3,"refs":"","question":"Why do exposure limits vary with frequency?","answers":["Lower frequency RF fields have more energy than higher frequency fields","Lower frequency RF fields do not penetrate the human body","Higher frequency RF fields are transient in nature","The human body absorbs more RF energy at some frequencies than at others"],"figure":"","correct_letter":"D"},{"id":"T0C06","correct":1,"refs":"","question":"Which of the following is an acceptable method to determine whether your station complies with FCC RF exposure regulations?","answers":["By calculation based on computer modeling","All these choices are correct","By measurement of field strength using calibrated equipment","By calculation based on FCC OET Bulletin 65"],"figure":"","correct_letter":"B"},{"id":"T0C07","correct":3,"refs":"","question":"What hazard is created by touching an antenna during a transmission?","answers":["Electrocution","Exposure to ionizing radiation","All these choices are correct","RF burn to skin"],"figure":"","correct_letter":"D"},{"id":"T0C08","correct":0,"refs":"","question":"Which of the following actions can reduce exposure to RF radiation?","answers":["Relocate antennas","Increase the duty cycle","All these choices are correct","Relocate the transmitter"],"figure":"","correct_letter":"A"},{"id":"T0C09","correct":2,"refs":"","question":"How can you make sure your station stays in compliance with RF safety regulations?","answers":["By informing the FCC of any changes made in your station","By making sure your antennas have low SWR","By re-evaluating the station whenever an item in the transmitter or antenna system is changed","By using only Underwriter Laboratories approved transmitting equipment"],"figure":"","correct_letter":"C"},{"id":"T0C10","correct":3,"refs":"","question":"Why is duty cycle one of the factors used to determine safe RF radiation exposure levels?","answers":["It takes into account the thermal effects of the final amplifier","It takes into account the antenna feed line loss","It affects the peak exposure to radiation","It affects the average exposure to radiation"],"figure":"","correct_letter":"D"},{"id":"T0C11","correct":3,"refs":"","question":"What is the definition of duty cycle during the averaging time for RF exposure?","answers":["The difference between the lowest and highest power output of a transmitter","The difference between the PEP and the average power output of a transmitter","The percentage of time that a transmitter is not transmitting","The percentage of time that a transmitter is transmitting"],"figure":"","correct_letter":"D"},{"id":"T0C12","correct":2,"refs":"","question":"How does RF radiation differ from ionizing radiation (radioactivity)?","answers":["RF radiation is perfectly safe","RF radiation can only be detected with an RF dosimeter","RF radiation does not have sufficient energy to cause chemical changes in cells and damage DNA","RF radiation is limited in range to a few feet"],"figure":"","correct_letter":"C"},{"id":"T0C13","correct":0,"refs":"","question":"Who is responsible for ensuring that no person is exposed to RF energy above the FCC exposure limits?","answers":["The station licensee","Anyone who is near an antenna","The local zoning board","The FCC"],"figure":"","correct_letter":"A"}]},{"name":"General","pool":"2023-2027","effective":"July 1, 2023","examSize":35,"passScore":26,"questions":[{"id":"G1A01","correct":0,"refs":"[97.301(d)]","question":"On which HF and/or MF amateur bands are there portions where General class licensees cannot transmit?","answers":["80 meters, 40 meters, 20 meters, and 15 meters","160 meters, 60 meters, 15 meters, and 12 meters","80 meters, 20 meters, 15 meters, and 10 meters","60 meters, 30 meters, 17 meters, and 12 meters"],"figure":"","correct_letter":"A"},{"id":"G1A02","correct":3,"refs":"[97.305]","question":"On which of the following bands is phone operation prohibited?","answers":["12 meters","17 meters","160 meters","30 meters"],"figure":"","correct_letter":"D"},{"id":"G1A03","correct":0,"refs":"[97.305]","question":"On which of the following bands is image transmission prohibited?","answers":["30 meters","12 meters","20 meters","160 meters"],"figure":"","correc ],"figure":"","correct_letter":"A"},{"id":"G1B08","correct":0,"refs":"[97.111(a)(1)]","question":"When is it permissible to communicate with amateur stations in countries outside the areas administered by the Federal Communications Commission?","answers":["When the contact is with amateurs in any country except those whose administrations have notified the ITU that they object to such communications","Only when the contact is with amateurs licensed by a country which is a member of the International Amateur Radio Union, or by a territory possessed by such a country","Only when the foreign country has a formal third-party agreement filed with the FCC","Only when the contact is with amateurs licensed by a country which is a member of the United Nations, or by a territory possessed by such a country"],"figure":"","correct_letter":"A"},{"id":"G1B09","correct":0,"refs":"[97.203(d)]","question":"On what HF frequencies are automatically controlled beacons permitted?","answers":["28.20 MHz to 28.30 MHz","21.08 MHz to 21.09 MHz","On any frequency if transmissions are in Morse code","On any frequency if power is less than 1 watt"],"figure":"","correct_letter":"A"},{"id":"G1B10","correct":2,"refs":"[97.203(c)]","question":"What is the power limit for beacon stations?","answers":["10 watts PEP output","20 watts PEP output","100 watts PEP output","200 watts PEP output"],"figure":"","correct_letter":"C"},{"id":"G1B11","correct":0,"refs":"[97.101(a)]","question":"Who or what determines \"good engineering and good amateur practice,\" as applied to the operation of an amateur station in all respects not covered by the Part 97 rules?","answers":["The FCC","The IEEE","The ITU","The control operator"],"figure":"","correct_letter":"A"},{"id":"G1C01","correct":0,"refs":"[97.313(c)(1)]","question":"What is the maximum transmitter power an amateur station may use on 10.140 MHz?","answers":["200 watts PEP output","2000 watts PEP output","1500 watts PEP output","1000 watts PEP output"],"figu ral or Technician class band segment","Only on the Technician band segments until you have a receipt for the FCC application fee payment"],"figure":"","correct_letter":"C"},{"id":"G1D04","correct":0,"refs":"[97.509(3)(i)(c)]","question":"Who must observe the administration of a Technician class license examination?","answers":["At least three Volunteer Examiners of General class or higher","At least two Volunteer Examiners of General class or higher","At least two Volunteer Examiners of Technician class or higher","At least three Volunteer Examiners of Technician class"],"figure":"","correct_letter":"A"},{"id":"G1D05","correct":2,"refs":"[97.7]","question":"When operating a US station by remote control from outside the country, what license is required of the control operator?","answers":["Only an appropriate US operator/primary license and a special remote station permit from the FCC","A license from the foreign country and a special remote station permit from the FCC","A US operator/primary station license","Only a license from the foreign country, as long as the call sign includes identification of portable operation in the US"],"figure":"","correct_letter":"C"},{"id":"G1D06","correct":2,"refs":"[97.119(f)(2)]","question":"Until an upgrade to General class is shown in the FCC database, when must a Technician licensee identify with \"AG\" after their call sign?","answers":["Whenever they operate on any amateur frequency","Whenever they operate using Technician frequency privileges","Whenever they operate using General class frequency privileges","A special identifier is not required if their General class license application has been filed with the FCC"],"figure":"","correct_letter":"C"},{"id":"G1D07","correct":1,"refs":"[97.509(b)(1)]","question":"Volunteer Examiners are accredited by what organization?","answers":["The Universal Licensing System","A Volunteer Examiner Coordinator","The Wireless Telecommunications Bureau","The Federal Communications Commission"],  sideband"],"figure":"","correct_letter":"A"},{"id":"G2A05","correct":2,"refs":"","question":"Which mode of voice communication is most commonly used on the HF amateur bands?","answers":["Frequency modulation","Double sideband","Single sideband","Single phase modulation"],"figure":"","correct_letter":"C"},{"id":"G2A06","correct":2,"refs":"","question":"Which of the following is an advantage of using single sideband, as compared to other analog voice modes on the HF amateur bands?","answers":["Less subject to interference from atmospheric static crashes","Ease of tuning on receive and immunity to impulse noise","Less bandwidth used and greater power efficiency","Very high-fidelity voice modulation"],"figure":"","correct_letter":"C"},{"id":"G2A07","correct":2,"refs":"","question":"Which of the following statements is true of single sideband (SSB)?","answers":["SSB is the only voice mode authorized on the 20-, 15-, and 10-meter amateur bands","SSB is the only voice mode authorized on the 160-, 75-, and 40-meter amateur bands","Only one sideband is transmitted; the other sideband and carrier are suppressed","Only one sideband and the carrier are transmitted; the other sideband is suppressed"],"figure":"","correct_letter":"C"},{"id":"G2A08","correct":3,"refs":"","question":"What is the recommended way to break into a phone contact?","answers":["Say \"CQ\" followed by the call sign of either station","Say \"QRZ\" several times, followed by your call sign","Say \"Breaker Breaker\"","Say your call sign once"],"figure":"","correct_letter":"D"},{"id":"G2A09","correct":2,"refs":"","question":"Why do most amateur stations use lower sideband on the 160-, 75-, and 40-meter bands?","answers":["Lower sideband is the only sideband legal on these frequency bands","Because it is fully compatible with an AM detector","It is commonly accepted amateur practice","Lower sideband is more efficient than upper sideband at these frequencies"],"figure":"","correct_letter":"C"},{"id":"G2A10","co ate current without exceeding maximum allowable grid current","Minimum SWR on the antenna","Highest plate voltage while minimizing grid current","Desired power output without exceeding maximum allowable plate current"],"figure":"","correct_letter":"D"},{"id":"G4A09","correct":0,"refs":"","question":"What is the purpose of delaying RF output after activating a transmitter's keying line to an external amplifier?","answers":["To allow time for the amplifier to switch the antenna between the transceiver and the amplifier output","To prevent key clicks on CW","To prevent transient overmodulation","To allow time for the amplifier power supply to reach operating level"],"figure":"","correct_letter":"A"},{"id":"G4A10","correct":2,"refs":"","question":"What is the function of an electronic keyer?","answers":["Automatic transmit/receive switching","To allow time for switching the antenna from the receiver to the transmitter","Automatic generation of dots and dashes for CW operation","Computer interface for PSK and RTTY operation"],"figure":"","correct_letter":"C"},{"id":"G4A11","correct":3,"refs":"","question":"Why should the ALC system be inactive when transmitting AFSK data signals?","answers":["All these choices are correct","When using digital modes, too much ALC activity can cause the transmitter to overheat","ALC will invert the modulation of the AFSK mode","The ALC action distorts the signal"],"figure":"","correct_letter":"D"},{"id":"G4A12","correct":0,"refs":"","question":"Which of the following is a common use of the dual-VFO feature on a transceiver?","answers":["To transmit on one frequency and listen on another","To improve frequency accuracy by allowing variable frequency output (VFO) operation","To permit full duplex operation -- that is, transmitting and receiving at the same time","To allow transmitting on two frequencies at once"],"figure":"","correct_letter":"A"},{"id":"G4A13","correct":0,"refs":"","question":"What is the purpose of using a receive attenuato erence from your station"],"figure":"","correct_letter":"A"},{"id":"G4C11","correct":0,"refs":"","question":"What technique helps to minimize RF \"hot spots\" in an amateur station?","answers":["Bonding all equipment enclosures together","Building all equipment in a metal enclosure","Placing low-pass filters on all feed lines","Using surge suppressor power outlets"],"figure":"","correct_letter":"A"},{"id":"G4C12","correct":1,"refs":"","question":"Why must all metal enclosures of station equipment be grounded?","answers":["It ensures that the neutral wire is grounded","It ensures that hazardous voltages cannot appear on the chassis","It prevents signal overload","It prevents a blown fuse in the event of an internal short circuit"],"figure":"","correct_letter":"B"},{"id":"G4D01","correct":3,"refs":"","question":"What is the purpose of a speech processor in a transceiver?","answers":["Decrease high-frequency voice output to prevent out-of-band operation","Increase transmitter bass response for more natural-sounding SSB signals","Prevent distortion of voice signals","Increase the apparent loudness of transmitted voice signals"],"figure":"","correct_letter":"D"},{"id":"G4D02","correct":3,"refs":"","question":"How does a speech processor affect a single sideband phone signal?","answers":["It reduces harmonic distortion","It increases peak power","It reduces intermodulation distortion","It increases average power"],"figure":"","correct_letter":"D"},{"id":"G4D03","correct":0,"refs":"","question":"What is the effect of an incorrectly adjusted speech processor?","answers":["All these choices are correct","Excessive background noise","Excess intermodulation products","Distorted speech"],"figure":"","correct_letter":"A"},{"id":"G4D04","correct":3,"refs":"","question":"What does an S meter measure?","answers":["Transmitter power output","Impedance","Carrier suppression","Received signal strength"],"figure":"","correct_letter":"D"},{"id":"G4D05","correct":1,"refs":"","question":"  shorted at the far end?","answers":["Very low impedance","The same as the characteristic impedance of the transmission line","The same as the generator output impedance","Very high impedance"],"figure":"","correct_letter":"D"},{"id":"E9F10","correct":2,"refs":"","question":"What impedance does a 1/8-wavelength transmission line present to an RF generator when the line is shorted at the far end?","answers":["A capacitive reactance","Zero","An inductive reactance","The same as the characteristic impedance of the line"],"figure":"","correct_letter":"C"},{"id":"E9F11","correct":3,"refs":"","question":"What impedance does a 1/8-wavelength transmission line present to an RF generator when the line is open at the far end?","answers":["Infinite","The same as the characteristic impedance of the line","An inductive reactance","A capacitive reactance"],"figure":"","correct_letter":"D"},{"id":"E9F12","correct":1,"refs":"","question":"What impedance does a 1/4-wavelength transmission line present to an RF generator when the line is open at the far end?","answers":["The same as the characteristic impedance of the line","Very low impedance","Very high impedance","The same as the input impedance to the generator"],"figure":"","correct_letter":"B"},{"id":"E9G01","correct":0,"refs":"","question":"Which of the following can be calculated using a Smith chart?","answers":["Impedance along transmission lines","Radio propagation","Radiation resistance","Antenna radiation pattern"],"figure":"","correct_letter":"A"},{"id":"E9G02","correct":0,"refs":"","question":"What type of coordinate system is used in a Smith chart?","answers":["Resistance circles and reactance arcs","Resistance lines and reactance chords","Voltage chords and current chords","Voltage circles and current arcs"],"figure":"","correct_letter":"A"},{"id":"E9G03","correct":3,"refs":"","question":"Which of the following is often determined using a Smith chart?","answers":["Beam headings and radiation patterns","Point-to-point propagation reliability as a function of frequency","Satellite azimuth and elevation bearings","Impedance and SWR values in transmission lines"],"figure":"","correct_letter":"D"},{"id":"E9G04","correct":3,"refs":"","question":"What are the two families of circles and arcs that make up a Smith chart?","answers":["Reactance and voltage","Voltage and impedance","Inductance and capacitance","Resistance and reactance"],"figure":"","correct_letter":"D"},{"id":"E9G05","correct":3,"refs":"","question":"Which of the following is a common use for a Smith chart?","answers":["Determine the impedance of a transmission line, given the physical dimensions","Determine the loss/100 feet of a transmission line, given the velocity factor and conductor materials","Determine the gain of an antenna given the physical and electrical parameters","Determine the length and position of an impedance matching stub"],"figure":"","correct_letter":"D"},{"id":"E9G06","correct":1,"refs":"","question":"On the Smith chart shown in Figure E9-3, what is the name for the large outer circle on which the reactance arcs terminate?","answers":["Prime axis","Reactance axis","Impedance axis","Polar axis"],"figure":"E9-3","correct_letter":"B"},{"id":"E9G07","correct":0,"refs":"","question":"On the Smith chart shown in Figure E9-3, what is the only straight line shown?","answers":["The resistance axis","The voltage axis","The current axis","The reactance axis"],"figure":"E9-3","correct_letter":"A"},{"id":"E9G08","correct":0,"refs":"","question":"How is a Smith chart normalized?","answers":["Reassign the prime center\u2019s impedance value","Reassign the resistance axis with reactance values","Reassign the reactance axis with resistance values","Reassign the prime center to the reactance axis"],"figure":"E9-3","correct_letter":"A"},{"id":"E9G09","correct":2,"refs":"","question":"What third family of circles is often added to a Smith chart during the process of designing impedance matching networks?","answers":["Transmission line length circles","Coaxial-length circles","Constant-SWR circles","Radiation-pattern circles"],"figure":"","correct_letter":"C"},{"id":"E9G10","correct":1,"refs":"","question":"What do the arcs on a Smith chart represent?","answers":["Points with constant resistance","Points with constant reactance","Frequency","SWR"],"figure":"","correct_letter":"B"},{"id":"E9G11","correct":3,"refs":"","question":"In what units are the wavelength scales on a Smith chart calibrated?","answers":["In fractions of transmission line electrical frequency","In fractions of antenna electrical frequency","In fractions of antenna electrical wavelength","In fractions of transmission line electrical wavelength"],"figure":"","correct_letter":"D"},{"id":"E9H01","correct":0,"refs":"","question":"When constructing a Beverage antenna, which of the following factors should be included in the design to achieve good performance at the desired frequency?","answers":["It should be at least one wavelength long","It must be mounted more than 1 wavelength above ground","It should be configured as a four-sided loop","Its overall length must not exceed 1/4 wavelength"],"figure":"","correct_letter":"A"},{"id":"E9H02","correct":1,"refs":"","question":"Which is generally true for 160- and 80-meter receiving antennas?","answers":["They must be erected at least 1/2 wavelength above the ground to attain good directivity","Atmospheric noise is so high that directivity is much more important than losses","All these choices are correct","Low loss coax transmission line is essential for good performance"],"figure":"","correct_letter":"B"},{"id":"E9H03","correct":0,"refs":"","question":"What is receiving directivity factor (RDF)?","answers":["Peak antenna gain compared to average gain over the hemisphere around and above the antenna","Forward gain compared to the gain in the reverse direction","Relative directivity compared to isotropic","Relative directivity compared to a dipole"],"figure":"","correct_letter":"A"},{"id":"E9H04","correct":3,"refs":"","question":"What is the purpose of placing an electrostatic shield around a small-loop direction-finding antenna?","answers":["It eliminates tracking errors caused by strong out-of-band signals","It adds capacitive loading, increasing the bandwidth of the antenna","It increases signal strength by providing a better match to the feed line","It eliminates unbalanced capacitive coupling to the antenna\u2019s surroundings, improving the depth of its nulls"],"figure":"","correct_letter":"D"},{"id":"E9H05","correct":3,"refs":"","question":"What challenge is presented by a small wire-loop antenna for direction finding?","answers":["It does not have a clearly defined null","It is practical for use only on VHF and higher bands","All these choices are correct","It has a bidirectional null pattern"],"figure":"","correct_letter":"D"},{"id":"E9H06","correct":2,"refs":"","question":"What indicates the correct value of terminating resistance for a Beverage antenna?","answers":["Maximum DC current in the terminating resistor","Maximum feed point DC resistance at the center of the desired frequency range","Minimum variation in SWR over the desired frequency range","Minimum low-angle front-to-back ratio at the design frequency"],"figure":"","correct_letter":"C"},{"id":"E9H07","correct":1,"refs":"","question":"What is the function of a Beverage antenna\u2019s termination resistor?","answers":["Increase the front-to-side ratio","Absorb signals from the reverse direction","Eliminate harmonic reception","Decrease SWR bandwidth"],"figure":"","correct_letter":"B"},{"id":"E9H08","correct":1,"refs":"","question":"What is the function of a sense antenna?","answers":["It increases the sensitivity of a DF antenna array","It modifies the pattern of a DF antenna to provide a null in only one direction","It allows DF antennas to receive signals at different vertical angles","It provides diversity reception that cancels multipath signals"],"figure":"","correct_letter":"B"},{"id":"E9H09","correct":3,"refs":"","question":"What type of radiation pattern is created by a single-turn, terminated loop such as a pennant antenna?","answers":["Omnidirectional","Bidirectional","Hyperbolic","Cardioid"],"figure":"","correct_letter":"D"},{"id":"E9H10","correct":2,"refs":"","question":"How can the output voltage of a multiple-turn receiving loop antenna be increased?","answers":["By reducing the permeability of the loop shield","By utilizing high impedance wire for the coupling loop","By increasing the number of turns and/or the area enclosed by the loop","All these choices are correct"],"figure":"","correct_letter":"C"},{"id":"E9H11","correct":2,"refs":"","question":"What feature of a cardioid pattern antenna makes it useful for direction-finding antennas?","answers":["Broadband response","A very sharp peak","A single null","High radiation angle"],"figure":"","correct_letter":"C"},{"id":"E0A01","correct":3,"refs":"","question":"What is the primary function of an external earth connection or ground rod?","answers":["Reduce RF current flow between pieces of equipment","Prevent static build up on power lines","Protect breaker panel from power surges","Lightning charge dissipation"],"figure":"","correct_letter":"D"},{"id":"E0A02","correct":2,"refs":"","question":"When evaluating RF exposure levels from your station at a neighbor\u2019s home, what must you do?","answers":["Ensure signals from your station are less than the controlled maximum permissible exposure (MPE) limits","Ensure signals from your station are less than the controlled maximum permissible emission (MPE) limits","Ensure signals from your station are less than the uncontrolled maximum permissible exposure (MPE) limits","Ensure signals from your station are less than the uncontrolled maximum permissible emission (MPE) limits"],"figure":"","correct_letter":"C"},{"id":"E0A03","correct":2,"refs":"","question":"Over what range of frequencies are the FCC human body RF exposure limits most restrictive?","answers":["300 - 3000 MHz","300 kHz - 3 MHz","30 - 300 MHz","3 - 30 MHz"],"figure":"","correct_letter":"C"},{"id":"E0A04","correct":0,"refs":"","question":"When evaluating a site with multiple transmitters operating at the same time, the operators and licensees of which transmitters are responsible for mitigating over-exposure situations?","answers":["Each transmitter that produces 5 percent or more of its MPE limit in areas where the total MPE limit is exceeded","Each transmitter that produces 20 percent or more of its MPE limit in areas where the total MPE limit is exceeded","Each transmitter operating with a duty cycle greater than 50 percent","Each transmitter operating with a duty cycle greater than 25 percent"],"figure":"","correct_letter":"A"},{"id":"E0A05","correct":0,"refs":"","question":"What hazard is created by operating at microwave frequencies?","answers":["The high gain antennas commonly used can result in high exposure levels","The extremely high frequency energy can damage the joints of antenna structures","Microwaves are in the frequency range where wave velocity is higher","Microwaves are ionizing radiation"],"figure":"","correct_letter":"A"},{"id":"E0A06","correct":1,"refs":"","question":"Why are there separate electric (E) and magnetic (H) MPE limits at frequencies below 300 MHz?","answers":["Ground reflections and scattering cause the field strength to vary with location","All these choices are correct","The body reacts to electromagnetic radiation from both the E and H fields","E field and H field radiation intensity peaks can occur at different locations"],"figure":"","correct_letter":"B"},{"id":"E0A07","correct":0,"refs":"","question":"What is meant by \u201c100% tie-off\u201d regarding tower safety?","answers":["At least one lanyard attached to the tower at all times","All loose ropes and guys secured to a fixed structure","All circuit breakers feeding power to the tower must be tied closed with tape, cable, or ties","All tools secured to the climber\u2019s harness"],"figure":"","correct_letter":"A"},{"id":"E0A08","correct":3,"refs":"","question":"What does SAR measure?","answers":["Signal attenuation ratio","Signal amplification rating","The rate of RF energy reflected from stationary terrain","The rate at which RF energy is absorbed by the body"],"figure":"","correct_letter":"D"},{"id":"E0A09","correct":0,"refs":"","question":"Which of the following types of equipment are exempt from RF exposure evaluations?","answers":["Hand-held transceivers sold before May 3, 2021","Dish antennas less than one meter in diameter","Antennas that radiate only in the near field","Transceivers with less than 7 watts of RF output"],"figure":"","correct_letter":"A"},{"id":"E0A10","correct":2,"refs":"","question":"When must an RF exposure evaluation be performed on an amateur station operating on 80 meters?","answers":["When the output power from the transmitter is less than 100 watts","When the ERP of the station is less than 10 watts","An evaluation must always be performed","When the station\u2019s operating mode is CW"],"figure":"","correct_letter":"C"},{"id":"E0A11","correct":1,"refs":"","question":"To what should lanyards be attached while climbing?","answers":["Guy brackets","Tower legs","Tower rungs","Antenna mast"],"figure":"","correct_letter":"B"},{"id":"E0A12","correct":2,"refs":"","question":"Where should a shock-absorbing lanyard be attached to a tower when working above ground?","answers":["Even with the climber's waist","To the next lowest set of guys","Above the climber\u2019s head level","To the belt of the fall-arrest harness"],"figure":"","correct_letter":"C"}]}];
var allQuestions=[], exam=null;
var quizQuestions=[], currentIndex=0, correctCount=0, totalQuestions=35, answered=false, missed=[], answerMap=[];
function show(id,on){document.getElementById(id).style.display=on?'block':'none';}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function buildExamButtons(){var c=document.getElementById('examButtons');for(var i=0;i<exams.length;i++){var b=document.createElement('button');b.className='exam-btn';b.innerHTML=exams[i].name+' Class<small>'+exams[i].pool+' Question Pool &#8226; '+exams[i].questions.length+' questions</small>';b.setAttribute('data-i',i);b.onclick=function(){selectExam(parseInt(this.getAttribute('data-i')));};c.appendChild(b);}}
function selectExam(i){exam=exams[i];allQuestions=exam.questions;document.title=exam.name+' Class Practice Exam ('+exam.pool+')';document.getElementById('title').textContent=exam.name+' Class Practice Exam';document.getElementById('subtitle').innerHTML=exam.pool+' Question Pool &#8226; '+allQuestions.length+' Questions &#8226; Effective '+exam.effective;document.getElementById('setupInfo').innerHTML='The actual exam is '+exam.examSize+' questions (must score '+exam.passScore+'/'+exam.examSize+' to pass).<br>Choose a preset or enter a custom number.';var p=document.getElementById('presetButtons');p.innerHTML='';var counts=[10,20,exam.examSize,100].filter(function(n,k,a){return a.indexOf(n)===k;}).sort(function(a,b){return a-b;});for(var k=0;k<counts.length;k++){var b=document.createElement('button');b.className='preset-btn';b.textContent=counts[k]+(counts[k]===exam.examSize?' (Full Exam)':'');b.setAttribute('data-n',counts[k]);b.onclick=function(){startQuiz(parseInt(this.getAttribute('data-n')));};p.appendChild(b);}document.getElementById('customCount').max=allQuestions.length;show('examSelect',false);show('setup',true);}
function showExamSelect(){show('quiz',false);show('results',false);show('setup',false);show('examSelect',true);document.title='Ham Radio Practice Exams';document.getElementById('title').textContent='Ham Radio Practice Exams';document.getElementById('subtitle').textContent='Select an exam';}
function startQuiz(count){count=Math.max(1,Math.min(count||exam.examSize,allQuestions.length));totalQuestions=count;quizQuestions=shuffle(allQuestions.slice()).slice(0,count);currentIndex=0;correctCount=0;answered=false;missed=[];show('setup',false);show('results',false);show('quiz',true);showQuestion();}
function showQuestion(){var q=quizQuestions[currentIndex];answered=false;document.getElementById('questionId').textContent=q.id+(q.refs?' '+q.refs:'');document.getElementById('questionText').textContent=q.question;document.getElementById('questionCounter').textContent='Question '+(currentIndex+1)+' of '+totalQuestions;document.getElementById('scoreTracker').textContent='Score: '+correctCount+'/'+currentIndex;document.getElementById('progressFill').style.width=((currentIndex/totalQuestions)*100)+'%';document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='';document.getElementById('nextBtn').style.display='none';var fig=document.getElementById('questionFigure');if(q.figure&&figures[q.figure]){fig.innerHTML='<img src="'+figures[q.figure]+'" alt="'+q.figure+'">';fig.style.display='block';}else{fig.innerHTML='';fig.style.display='none';}var c=document.getElementById('answersContainer');c.innerHTML='';var L=['A','B','C','D'];answerMap=shuffle([0,1,2,3]);for(var i=0;i<answerMap.length;i++){var b=document.createElement('button');b.className='answer-btn';b.innerHTML='<span class="answer-letter">'+L[i]+'</span>'+q.answers[answerMap[i]];b.setAttribute('data-i',String(answerMap[i]));b.onclick=function(){selectAnswer(parseInt(this.getAttribute('data-i')));};c.appendChild(b);}}
function selectAnswer(s){if(answered)return;answered=true;var q=quizQuestions[currentIndex];var btns=document.querySelectorAll('.answer-btn');var fb=document.getElementById('feedback');var L=['A','B','C','D'];for(var i=0;i<btns.length;i++){var origIdx=parseInt(btns[i].getAttribute('data-i'));btns[i].classList.add('disabled');if(origIdx===q.correct)btns[i].classList.add('correct');if(origIdx===s&&s!==q.correct)btns[i].classList.add('incorrect');}if(s===q.correct){correctCount++;fb.className='feedback correct-fb';fb.innerHTML='Correct!';}else{var correctShuffledPos=answerMap.indexOf(q.correct);fb.className='feedback incorrect-fb';fb.innerHTML='Incorrect. The correct answer is <strong>'+L[correctShuffledPos]+': '+q.answers[q.correct]+'</strong>';missed.push({question:q,selected:s,answerMap:answerMap.slice()});}if(q.refs){fb.innerHTML+='<div class="ref-text">Reference: '+q.refs+'</div>';}document.getElementById('scoreTracker').textContent='Score: '+correctCount+'/'+(currentIndex+1);document.getElementById('nextBtn').style.display='block';document.getElementById('nextBtn').textContent=currentIndex<totalQuestions-1?'Next Question':'See Results';}
function nextQuestion(){currentIndex++;if(currentIndex>=totalQuestions){showResults();}else{showQuestion();}}
function showResults(){show('quiz',false);show('results',true);var pct=Math.round((correctCount/totalQuestions)*100);var need=Math.round(exam.passScore/exam.examSize*100);var passed=pct>=need;var c=document.getElementById('scoreCircle');c.className='score-circle '+(passed?'pass':'fail');c.textContent=pct+'%';document.getElementById('resultsText').textContent=passed?'You Passed!':'Keep Studying';document.getElementById('resultsDetail').textContent=correctCount+' correct out of '+totalQuestions+' (passing is '+need+'%)';var r=document.getElementById('reviewSection');if(missed.length>0){var L=['A','B','C','D'];var h='<h3>Missed Questions ('+missed.length+')</h3>';for(var i=0;i<missed.length;i++){var m=missed[i];var yourPos=m.answerMap.indexOf(m.selected);var correctPos=m.answerMap.indexOf(m.question.correct);h+='<div class="review-item"><div class="q-id">'+m.question.id+'</div><div class="q-text">'+m.question.question+'</div><div class="your-answer">Your answer: '+L[yourPos]+' - '+m.question.answers[m.selected]+'</div><div class="correct-answer">Correct: '+L[correctPos]+' - '+m.question.answers[m.question.correct]+'</div></div>';}r.innerHTML=h;}else{r.innerHTML='<h3 style="color:#4caf50;">Perfect Score!</h3>';}}
function showSetup(){show('quiz',false);show('results',false);show('setup',true);}
buildExamButtons();
</script>
